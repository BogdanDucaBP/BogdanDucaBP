<html>
<head>
    <title>Test Reports</title>
    <style>
        /* Basic styling for the accordion */
        details {
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        summary {
            font-weight: bold;
            padding: 10px;
            cursor: pointer;
            /* Default background and text color, will be overridden by JS for success/failure */
            background-color: #f0f0f0;
            color: #333; /* Dark gray text */
            border-bottom: 1px solid #ccc;
            list-style: none; /* Hide default triangle/arrow */
            display: flex; /* Use flexbox for alignment of arrow and text */
            align-items: center; /* Vertically align items */
        }

        /* Custom arrow for summary */
        summary::-webkit-details-marker {
            display: none;
        }

        summary::before {
            content: '►'; /* Right-pointing triangle for closed state */
            display: inline-block;
            width: 1em;
            margin-right: 8px; /* Slightly more space for the arrow */
            transition: transform 0.2s ease-in-out;
        }

        details[open] summary::before {
            content: '▼'; /* Down-pointing triangle for open state */
            transform: rotate(90deg); /* Optional: Rotate for a smoother transition */
        }

        /* Colors for success/failure summaries */
        details.success summary {
            background-color: #d4edda; /* Light green */
            color: #155724; /* Dark green text */
            border-color: #c3e6cb;
        }

        details.failure summary {
            background-color: #f8d7da; /* Light red */
            color: #721c24; /* Dark red text */
            border-color: #f5c6cb;
        }

        details.neutral summary {
            background-color: #fefefe; /* Very light gray/almost white */
            color: #6c757d; /* Gray text */
            border-color: #e0e0e0;
        }


        .test-content {
            padding: 10px;
            background-color: #f9f9f9;
        }

        .test-suite-name {
            font-style: italic;
            margin-left: 15px; /* Indent test suite names */
            font-weight: normal;
        }

        p {
            margin: 5px 0; /* Adjust spacing for test cases */
            margin-left: 25px; /* Indent test cases */
        }

        /* --- CSS for BUTTON LINKS --- */
        .button-container {
            display: flex; /* Use flexbox to arrange buttons */
            flex-wrap: wrap; /* Allow buttons to wrap to the next line if needed */
            gap: 10px; /* Space between buttons */
            margin-bottom: 20px; /* Space below the button section */
        }

        .button-link {
            display: inline-block; /* Makes the link behave like a block for sizing, but inline with text flow */
            padding: 10px 15px;
            background-color: #007bff; /* A nice blue color (default) */
            color: white; /* White text */
            text-decoration: none; /* Remove underline */
            border-radius: 5px; /* Slightly rounded corners */
            border: none; /* No border */
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.1s ease; /* Smooth hover effect */
            white-space: nowrap; /* Prevent text from wrapping inside the button */
        }

        .button-link:hover {
            background-color: #0056b3; /* Darker blue on hover */
            transform: translateY(-1px); /* Slight lift effect on hover */
        }

        .button-link:active {
            background-color: #004085; /* Even darker on click */
            transform: translateY(0); /* Reset lift on active */
        }

        /* --- NEW CSS for RED BUG BUTTON --- */
        .bug-button {
            background-color: #dc3545; /* Red color for bugs */
        }

        .bug-button:hover {
            background-color: #c82333; /* Darker red on hover */
        }

        .bug-button:active {
            background-color: #bd2130; /* Even darker red on click */
        }
        /* --- END NEW CSS --- */

        /* --- CSS FOR TOTAL STATS SECTION --- */
        #total-stats {
            background-color: #e9f5ff; /* Light blue background to make it stand out */
            border: 1px solid #cce5ff; /* Light blue border */
            border-radius: 8px; /* Slightly more rounded corners */
            padding: 15px 20px; /* Increased padding for more space */
            margin-bottom: 20px; /* Space below this section */
            text-align: center; /* Center the text */
            font-size: 1.2em; /* Make the text slightly larger */
            font-weight: bold; /* Make all text in this section bold */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
            display: flex; /* Use flexbox for internal alignment */
            justify-content: center; /* Center content horizontally */
            align-items: center; /* Center content vertically */
        }

        #total-stats div {
            font-weight: inherit; /* Inherit font-weight from #total-stats */
        }

        /* Adjusting specific span colors to override the overall bold if needed, but not font-weight */
        #total-run { color: #007bff; } /* Blue for total run */
        #total-passed { color: #28a745; } /* Green for passed */
        #total-failed { color: #dc3545; } /* Red for failed */

        /* Ensuring the pipes are also bold and same size */
        #total-stats span {
            font-weight: inherit; /* Ensure all spans inherit the bold from the parent */
        }
        /* --- END CSS FOR TOTAL STATS SECTION --- */

        /* --- NEW CSS for Title with Logo --- */
        .page-title {
            display: flex; /* Use flexbox to align image and text */
            align-items: center; /* Vertically center the logo with the text */
            gap: 10px; /* Space between the logo and the text */
            font-size: 2em; /* Keep your H1 size, or adjust as needed */
            margin-bottom: 20px; /* Maintain good spacing below the title */
        }

        .page-title img {
            height: 60px; /* Adjusted height for a bigger logo */
            width: auto; /* Maintain aspect ratio */
            vertical-align: middle; /* Ensures it aligns nicely with text baseline */
        }
        /* --- END NEW CSS --- */

    </style>
</head>
<body>
    <h1 class="page-title">
        Welcome to <img src="reports/etm.webp" alt="ETM Logo"> Test Reports
    </h1>

    <div class="button-container">
        <a href="https://dev.azure.com/bebuse/ETM/_dashboards/dashboard/96fd841f-fd31-42de-8e84-502472485591" class="button-link" target="_blank">Automation Overview</a>
        <a href="https://dev.azure.com/bebuse/ETM/_queries/query/465b6a21-1aa0-44fc-88cc-6a60a939d880/" class="button-link" target="_blank">E2E Automated Test Cases List</a>
        <a href="https://dev.azure.com/bebuse/ETM/_queries/query/d834a08f-9fa6-4810-9ec1-8f83ba1b2799/" class="button-link bug-button" target="_blank">Automation Open BUG's</a>
        <a href="https://dev.azure.com/bebuse/ETM/_build?definitionId=1562&view=ms.vss-pipelineanalytics-web.new-build-definition-pipeline-analytics-view-cardmetrics" class="button-link" target="_blank">Analytics of QA - E2E Test Run</a>
        <a href="https://dev.azure.com/bebuse/ETM/_build?definitionId=1562&_a=summary" class="button-link" target="_blank">Pipeline Summary of QA-E2E Test Run</a>
    </div>

    <div id="total-stats">
        <div>
            <span id="total-run">0</span> Total run |
            <span id="total-passed">0</span> Total Passed |
            <span id="total-failed">0</span> Total Failed
        </div>
    </div>

    <div id="reports-container">
        <p>Loading test reports...</p>
    </div>

    <script>
        async function fetchReportsFromGitHub() {
            const repoOwner = "BogdanDucaBP";  // Replace with your GitHub username or org
            const repoName = "BogdanDucaBP";            // Replace with your repository name
            const reportsPath = "reports";              // The folder containing reports
            const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${reportsPath}`;

            const reportsContainer = document.getElementById('reports-container');
            reportsContainer.innerHTML = ''; // Clear the reports container before displaying new data

            let totalRun = 0, totalPassed = 0, totalFailed = 0;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

                const files = await response.json();
                const xmlFiles = files.filter(file => file.name.endsWith('.xml'));

                // Loop through each XML file and display its contents
                for (const file of xmlFiles) {
                    const fileUrl = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/${reportsPath}/${file.name}`;

                    try {
                        const fileResponse = await fetch(fileUrl);
                        if (!fileResponse.ok) throw new Error(`HTTP error! Status: ${fileResponse.status}`);

                        const xmlText = await fileResponse.text();
                        const parser = new DOMParser();
                        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

                        // Pass the xmlDoc to displayXml to extract total time
                        const { passed, failed } = displayXml(xmlDoc, file.name, reportsContainer);
                        totalPassed += passed;
                        totalFailed += failed;
                        totalRun += passed + failed;
                    } catch (fileError) {
                        console.error(`Error fetching ${file.name}:`, fileError);  // Log error to console
                    }
                }

                // Update the total stats
                document.getElementById('total-run').textContent = totalRun;
                document.getElementById('total-passed').textContent = totalPassed;
                document.getElementById('total-failed').textContent = totalFailed;

            } catch (error) {
                console.error("Error fetching reports list:", error);  // Log error to console
                reportsContainer.innerHTML = `<p>Error fetching reports list: ${error.message}</p>`;
            }
        }


        function displayXml(xmlDoc, headingText, reportsContainer) {
            let passed = 0;
            let failed = 0;
            let totalSuiteTime = 0; // Variable to store total time for the summary

            const testSuites = xmlDoc.querySelectorAll('testsuite');

            // Iterate through test suites to calculate total passed/failed and get total time
            testSuites.forEach(suite => {
                const suiteTime = parseFloat(suite.getAttribute('time'));
                if (!isNaN(suiteTime)) {
                    totalSuiteTime += suiteTime; // Accumulate time from each testsuite
                }

                const testCases = suite.querySelectorAll('testcase');
                testCases.forEach(testCase => {
                    const failure = testCase.querySelector('failure');
                    if (failure) {
                        failed++;
                    } else {
                        passed++;
                    }
                });
            });

            const totalTests = passed + failed;

            // Create a details element for the entire report file
            const detailsElement = document.createElement('details');
            reportsContainer.appendChild(detailsElement);

            // Set class based on success/failure status
            if (failed > 0) {
                detailsElement.classList.add('failure');
            } else if (passed > 0) {
                detailsElement.classList.add('success');
            } else {
                detailsElement.classList.add('neutral'); // For reports with no tests
            }

            // Create a summary element for the report file title (TEST-FileName.xml)
            const summaryElement = document.createElement('summary');
            // *** UPDATED: Append total execution time to the summary text ***
            let totalTimeDisplay = '';
            if (totalSuiteTime > 0) {
                totalTimeDisplay = ` (Execution Time: ${totalSuiteTime.toFixed(2)}s)`;
            }
            summaryElement.textContent = `${headingText} (Total: ${totalTests} | Failed: ${failed})${totalTimeDisplay}`;
            detailsElement.appendChild(summaryElement);

            // Create a div to hold the actual test content, which will be collapsible
            const testContentDiv = document.createElement('div');
            testContentDiv.classList.add('test-content');
            detailsElement.appendChild(testContentDiv);


            if (totalTests === 0) {
                const noTests = document.createElement('p');
                noTests.textContent = "No test cases found in this report.";
                testContentDiv.appendChild(noTests);
            } else {
                testSuites.forEach(suite => {
                    const suiteName = suite.getAttribute('name');
                    const suiteTime = parseFloat(suite.getAttribute('time'));
                    let timeDisplay = '';
                    if (!isNaN(suiteTime)) {
                        timeDisplay = ` (Time: ${suiteTime.toFixed(2)}s)`;
                    }

                    if (suiteName && suiteName !== "Unknown Suite") {
                        const suiteElement = document.createElement('p');
                        suiteElement.classList.add('test-suite-name');
                        suiteElement.textContent = `Test Suite: ${suiteName}${timeDisplay}`;
                        testContentDiv.appendChild(suiteElement);
                    }

                    const testCases = suite.querySelectorAll('testcase');
                    testCases.forEach(testCase => {
                        const caseName = testCase.getAttribute('name');
                        const caseElement = document.createElement('p');

                        const failure = testCase.querySelector('failure');
                        if (failure) {
                            caseElement.textContent = `❌ ${caseName} - FAILED`;
                            caseElement.style.color = "red";
                            const failureMessage = document.createElement('p');
                            failureMessage.textContent = `  - Reason: ${failure.textContent}`;
                            failureMessage.style.fontStyle = "italic";
                            failureMessage.style.marginLeft = "35px";
                            testContentDiv.appendChild(caseElement);
                            testContentDiv.appendChild(failureMessage);
                        } else {
                            caseElement.textContent = `✅ ${caseName} - PASSED`;
                            caseElement.style.color = "green";
                            testContentDiv.appendChild(caseElement);
                        }
                    });
                });
            }

            return { passed, failed };
        }

        fetchReportsFromGitHub();
    </script>
</body>
</html>
